[package]
name = "zerodroid-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stable C ABI over ZeroDroid's safe Rust image and VM specification cores"

[lib]
crate-type = ["staticlib"]

[dependencies]
zerodroid-image-core = { path = "../zerodroid-image-core" }
zerodroid-vm-spec-core = { path = "../zerodroid-vm-spec-core" }
